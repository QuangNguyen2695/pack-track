buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Provide Kotlin Gradle plugin for this module
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'com.example.camerabarcode'
  compileSdk 34

  defaultConfig {
    minSdk 23
    targetSdk 34
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  // Use the local Capacitor Android project to ensure version alignment
  compileOnly project(":capacitor-android")

  implementation "androidx.appcompat:appcompat:1.7.0"

  // CameraX - GIỮ CÙNG VERSION
  implementation "androidx.camera:camera-core:1.3.4"
  implementation "androidx.camera:camera-camera2:1.3.4"
  implementation "androidx.camera:camera-lifecycle:1.3.4"
  implementation "androidx.camera:camera-view:1.3.4"
  implementation "androidx.camera:camera-video:1.3.4"

  // ML Kit
  implementation "com.google.mlkit:barcode-scanning:17.2.0"
}
