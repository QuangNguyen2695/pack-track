<ion-header class="!pt-16">
  <ion-toolbar class="text-white">
    <div class="px-3 py-2">
      <ion-buttons slot="start" class="relative">
        <ion-back-button defaultHref="tabs/home" text="" icon="chevron-back-outline" color="white"></ion-back-button>
      </ion-buttons>
      <ion-title class="font-medium">
        <ng-container *ngIf="recordMode === 'return'">📦 Quay Video Trả Hàng</ng-container>
        <ng-container *ngIf="recordMode !== 'return'">Quét và Lưu Video</ng-container>
      </ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="flex w-full items-center justify-center flex-col gap-2 mt-2">
    <!-- Return Video Mode - Info and Start Button -->
    <ng-container *ngIf="recordMode === 'return' && !recording">
      <div class="bg-blue-900 rounded-lg p-4 w-full mx-2 text-white text-center">
        <p class="text-sm opacity-80">Đơn hàng trả hàng</p>
        <p class="text-2xl font-bold">{{ returnOrderId }}</p>
        <p class="text-xs opacity-60 mt-2">Nhấn nút bên dưới để bắt đầu ghi video</p>
      </div>
      <button
        nz-button
        nzType="primary"
        nzSize="large"
        (click)="startReturnVideoRecording()"
        [disabled]="recording"
        class="mt-4 py-6 px-4 bg-linear-to-r from-red-600 to-red-500 hover:from-red-700 hover:to-red-600 rounded-lg font-bold text-lg text-white shadow-lg transform transition hover:scale-105"
      >
        🎥 Bắt Đầu Quay Video Trả Hàng
      </button>
    </ng-container>

    <!-- Normal Mode or Recording State -->
    <ng-container *ngIf="recordMode !== 'return' || recording">
      <!-- Trạng thái quay -->
      <ng-container *ngIf="recording; else idleInfo">
        <p class="text-white font-medium">Mã đơn: #{{ currentCode }}</p>
        <p class="text-white font-medium">Đang quay: {{ durationTimeFormat }}</p>
        <ion-button size="default" (click)="saveVideoManually()"> Lưu đơn hàng </ion-button>
      </ng-container>
      <ng-template #idleInfo>
        <p class="text-white opacity-80">{{ infoText }}</p>
      </ng-template>
    </ng-container>
  </div>

  <!-- Cấu hình timestamp overlay -->
  <div class="px-2 mt-3 bg-[rgba(0,0,0,0.15)] rounded-lg p-4">
    <div class="grid grid-cols-3 gap-3">
      <!-- Ngày giờ -->
      <div class="flex flex-col items-center justify-center bg-[rgba(255,255,255,0.08)] rounded-lg p-3 border border-[rgba(255,255,255,0.1)]">
        <ion-icon name="time-outline" class="text-blue-400 text-2xl mb-2"></ion-icon>
        <label class="text-white text-xs font-medium text-center mb-2">Ngày giờ</label>
        <ion-toggle color="primary" [checked]="timestampEnabled" (ionChange)="setTimestampEnabled($event.detail.checked)"></ion-toggle>
      </div>

      <!-- Tự động lưu -->
      <div class="flex flex-col items-center justify-center bg-[rgba(255,255,255,0.08)] rounded-lg p-3 border border-[rgba(255,255,255,0.1)]">
        <ion-icon name="download-outline" class="text-blue-400 text-2xl mb-2"></ion-icon>
        <label class="text-white text-xs font-medium text-center mb-2">Tự động lưu</label>
        <ion-toggle color="primary" [checked]="autoSaveEnabled" (ionChange)="setAutoSaveEnabled($event.detail.checked)"></ion-toggle>
      </div>

      <!-- Ghi âm -->
      <div class="flex flex-col items-center justify-center bg-[rgba(255,255,255,0.08)] rounded-lg p-3 border border-[rgba(255,255,255,0.1)]">
        <ion-icon name="mic-outline" class="text-blue-400 text-2xl mb-2"></ion-icon>
        <label class="text-white text-xs font-medium text-center mb-2">Ghi âm</label>
        <ion-toggle color="primary" [checked]="audioEnabled" (ionChange)="setAudioEnabled($event.detail.checked)"></ion-toggle>
      </div>
    </div>
  </div>

  <!-- cụm nút dưới -->
  <div class="scan-btns absolute bottom-40 left-0 right-0 px-4">
    <button expand="full" (click)="toggleTorch()">
      <div *ngIf="!torchOn">
        <ion-icon src="assets/icons/flashlight-off.svg" class="text-2xl"></ion-icon>
        <label class="block text-sm text-white">Tắt đèn pin</label>
      </div>
      <div *ngIf="torchOn">
        <ion-icon src="assets/icons/flashlight-on.svg" class="text-2xl"></ion-icon>
        <label class="block text-sm text-white">Bật đèn pin</label>
      </div>
    </button>
  </div>
</ion-content>
