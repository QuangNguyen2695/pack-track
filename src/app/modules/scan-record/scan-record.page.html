<ion-header class="pt-10">
  <ion-toolbar class="text-white">
    <div class="px-3 py-2">
      <ion-buttons slot="start" class="relative">
        <ion-back-button defaultHref="tabs/home" text="" icon="chevron-back-outline" color="white"></ion-back-button>
      </ion-buttons>
      <ion-title class="font-medium">Quét mã</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="flex w-full items-center justify-center flex-col gap-2 mt-2">
    <!-- Trạng thái quay -->
    <ng-container *ngIf="recording; else idleInfo">
      <p class="text-white font-medium">Mã đơn: #{{ currentCode }}</p>
      <p class="text-white font-medium">Đang quay: {{ durationTimeFormat }}</p>
      <ion-button size="default" (click)="saveVideoManually()"> Lưu đơn hàng </ion-button>
    </ng-container>
    <ng-template #idleInfo>
      <p class="text-white opacity-80">{{ infoText }}</p>
    </ng-template>
  </div>

  <!-- Cấu hình timestamp overlay -->
  <div class="px-2 mt-3 bg-[rgba(0,0,0,0.25)] rounded-md">
    <ion-item lines="none" class="">
      <label class="text-white text-sm pr-2">Hiển thị ngày giờ</label>
      <ion-toggle color="primary" [checked]="timestampEnabled" (ionChange)="setTimestampEnabled($event.detail.checked)"></ion-toggle>
    </ion-item>
    <ion-item lines="none">
      <label class="text-white text-sm pr-2">Ghi âm</label>
      <ion-toggle color="primary" [checked]="audioEnabled" (ionChange)="setAudioEnabled($event.detail.checked)"></ion-toggle>
    </ion-item>
  </div>

  <!-- cụm nút dưới -->
  <div class="scan-btns absolute bottom-40 left-0 right-0 px-4">
    <button expand="full" (click)="toggleTorch()">
      <div *ngIf="!torchOn">
        <ion-icon src="assets/icons/flashlight-off.svg" class="text-2xl"></ion-icon>
        <label class="block text-sm text-white">Tắt đèn pin</label>
      </div>
      <div *ngIf="torchOn">
        <ion-icon src="assets/icons/flashlight-on.svg" class="text-2xl"></ion-icon>
        <label class="block text-sm text-white">Bật đèn pin</label>
      </div>
    </button>
  </div>
</ion-content>
