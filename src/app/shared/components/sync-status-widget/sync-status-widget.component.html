<div
  class="sync-widget"
  *ngIf="progress.isVisible"
  [class.syncing]="progress.isActive"
  [class.completed]="progress.status === 'completed'"
  [class.error]="progress.status === 'error'"
  [class.minimized]="isMinimized"
>
  <!-- Header -->
  <div class="sync-header flex items-center gap-2">
    <ion-icon
      [name]="getStatusIcon()"
      [class.spinning]="progress.isActive"
      (click)="isMinimized && onToggleMinimize()"
      [class]="isMinimized ? 'cursor-pointer' : ''"
    ></ion-icon>

    <!-- Title and buttons - với scale animation -->
    <div *ngIf="!isMinimized" class="header-content flex-1 flex items-center justify-between">
      <span class="sync-title">{{ getStatusText() }}</span>

      <div class="flex items-center gap-1">
        <!-- Minimize button -->
        <ion-button fill="clear" size="small" (click)="onToggleMinimize()" class="minimize-btn w-6 h-6 min-w-0">
          <ion-icon name="remove" slot="icon-only" class="text-sm"></ion-icon>
        </ion-button>

        <!-- Close button -->
        <ion-button fill="clear" size="small" (click)="onClose()" class="close-btn w-6 h-6 min-w-0">
          <ion-icon name="close" slot="icon-only" class="text-sm"></ion-icon>
        </ion-button>
      </div>
    </div>
  </div>

  <!-- Progress Info - với scale animation -->
  <div class="sync-info" *ngIf="progress.totalVideos > 0 && !isMinimized">
    <div class="progress-text justify-between items-center h-[28px]">
      <div class="flex items-center gap-2">
        <span> {{ progress.completedVideos + progress.failedVideos }}/{{ progress.totalVideos }} video</span>
        <span *ngIf="progress.failedVideos > 0" class="failed-count"> ({{ progress.failedVideos }} lỗi) </span>
      </div>
      <div class="sync-actions" *ngIf="!progress.isActive">
        <ion-button size="small" fill="clear" (click)="onRetrySync()" *ngIf="progress.status === 'error' || progress.failedVideos > 0">
          <ion-icon name="refresh" slot="start"></ion-icon>
          Thử lại
        </ion-button>
      </div>
    </div>

    <!-- Progress Bar -->
    <nz-progress
      [nzPercent]="getProgressPercentage()"
      [nzStatus]="getProgressStatus()"
      [nzStrokeWidth]="8"
      [nzShowInfo]="false"
      nzSize="small"
    ></nz-progress>
  </div>

  <!-- Action Buttons -->
</div>
