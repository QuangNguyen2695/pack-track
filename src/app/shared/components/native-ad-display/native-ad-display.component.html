<div class="native-ad-container" *ngIf="!hasError">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="ad-skeleton">
    <div class="skeletal-bar" style="height: 150px;"></div>
  </div>

  <!-- Ad Loaded State -->
  <div *ngIf="!isLoading && nativeAdData" class="native-ad-card" (click)="onAdClick()">
    <div class="ad-header">
      <span class="ad-badge">AD</span>
    </div>

    <!-- Ad Image -->
    <div *ngIf="nativeAdData.image" class="ad-image">
      <img [src]="nativeAdData.image.url" alt="Ad" class="img-fluid" />
    </div>

    <!-- Ad Headline -->
    <div class="ad-content p-3">
      <h6 class="ad-headline fw-bold text-truncate">
        {{ nativeAdData.headline }}
      </h6>

      <!-- Ad Body -->
      <p class="ad-body text-muted small mb-2">
        {{ nativeAdData.body | slice: 0: 80 }}...
      </p>

      <!-- CTA Button -->
      <button
        *ngIf="nativeAdData.callToAction"
        class="btn btn-sm btn-primary w-100"
      >
        {{ nativeAdData.callToAction }}
      </button>
    </div>
  </div>
</div>
